  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>CRUD Operations with jQuery and Anti-Forgery</title>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.2/css/bootstrap.min.css">
  </head>
  <body>
      <div class="container mt-5">
          <h1>Employee</h1>
  
          <!-- Create Operation -->
          <div class="mb-3">
              <label for="createName" class="form-label">Name</label>
              <input type="text" id="createName" class="form-control">
  
              <label for="createAge" class="form-label">Age</label>
              <input type="number" id="createAge" class="form-control">
  
              <label for="createEmail" class="form-label">Email</label>
              <input type="email" id="createEmail" class="form-control">
  
              <label for="createPhoneNumber" class="form-label">Phone Number</label>
              <input type="text" id="createPhoneNumber" class="form-control">
  
              <label for="createFile" class="form-label">File Upload</label>
              <input type="file" id="createFile" class="form-control">
  
              <button id="createButton" class="btn btn-primary mt-2">Create</button>
          </div>
  
          <!-- Read Operation -->
          <table id="readResults" class="table mt-2">
              <thead>
                  <tr>
                      <th>ID</th>
                      <th>Name</th>
                      <th>Age</th>
                      <th>Email</th>
                      <th>Phone Number</th>
                      <th>Actions</th>
                  </tr>
              </thead>
              <tbody>
              </tbody>
          </table>
      </div>
  
      <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.1/umd/popper.min.js"></script>
      <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  
  </body>
