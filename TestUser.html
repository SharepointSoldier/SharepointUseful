<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eligibility Verification</title>
    <style>
        .btn {
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .disabled {
            background-color: gray;
            color: white;
            cursor: not-allowed;
        }
        .enabled {
            background-color: green;
            color: white;
        }
    </style>
</head>
<body>

    <form id="eligibility-form">
        <label>1. Is the proposed private forest land at least five (5) acres in size?</label><br>
        <input type="radio" name="question1" value="yes"> Yes
        <input type="radio" name="question1" value="no"> No
        <br><br>

        <label>2. Is the proposed private forest land suitable to sustain natural vegetation?</label><br>
        <input type="radio" name="question2" value="yes"> Yes
        <input type="radio" name="question2" value="no"> No
        <br><br>

        <button id="continue-btn" class="btn disabled" disabled>Continue</button>
    </form>

    <script>
        function checkSelection() {
            const form = document.getElementById('eligibility-form');
            const allAnswered = [...form.querySelectorAll('input[type="radio"]')]
                .filter(input => input.checked)
                .length === form.querySelectorAll('input[type="radio"]').length / 2;

            const btn = document.getElementById('continue-btn');
            if (allAnswered) {
                btn.classList.remove('disabled');
                btn.classList.add('enabled');
                btn.disabled = false;
            } else {
                btn.classList.remove('enabled');
                btn.classList.add('disabled');
                btn.disabled = true;
            }
        }

        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', checkSelection);
        });
    </script>

</body>
</html>
