<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Downloads</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="pdf-list">
    <div class="pdf-item">
      <div class="pdf-icon">
        <img src="/images/pdf-icon.png" alt="PDF Icon">
      </div>
      <div class="pdf-details">
        <p class="pdf-title">Sample PDF</p>
        <p class="pdf-size" data-file-url="https://site-qtn9d.powerappsportals.com/sample.pdf">Fetching size...</p>
      </div>
      <div class="pdf-actions">
        <button class="action-button download" data-file-url="https://site-qtn9d.powerappsportals.com/sample.pdf">Download</button>
        <button class="action-button open" data-file-url="https://site-qtn9d.powerappsportals.com/sample.pdf">Open</button>
      </div>
    </div>
  </div>
 
  <script src="script.js"></script>
</body>
</html>
